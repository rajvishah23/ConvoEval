version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: convoeval-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-pull:
    image: ollama/ollama:latest
    container_name: convoeval-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5:3b"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: convoeval-api
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:3b
      - FACETS_PATH=data/facets_processed.csv
    volumes:
      - ../data:/app/data
      - ../results:/app/results
    restart: unless-stopped

  ui:
    image: nginx:alpine
    container_name: convoeval-ui
    ports:
      - "3000:80"
    volumes:
      - ../ui:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  ollama_data:
